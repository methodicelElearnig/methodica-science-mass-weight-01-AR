<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- QA / DEV SHELL — NOT the production entry point (since 2026-09-23).
       The platform (Kata) launches each component on its own with its own ?registration; the
       unit's production entry is the root index.html, a plain redirect to component 01 that
       carries the query string (ADDING-REPORTING-AND-RESUME.md §5.2). This shell is kept for the
       QA tool: it is never packaged (docs-and-tools/package-allowlist.ps1) and it opens every
       component with ?dev=1 so the in-unit hops still work here.

       Formerly the production unit shell. The original monolithic single-file
       implementation that used to live at this path is preserved,
       unmodified, at index-monolith-backup.html.

       Holds one full-viewport iframe (no chrome, no dev toolbar — that
       belongs to the QA tool's own chrome, not this file) that loads
       component 01 first, then bridges the SAME
       DEV_READY/DEV_STATE/DEV_GOTO/DEV_RESET postMessage protocol every
       component already speaks, in the SAME global screen numbers (0-49,
       minus the missing 40) the components use internally — see
       unit-shell.js for the full protocol and unit-manifest.js for the
       component/screen registry. Component folders remain the single
       source of truth for content and are unmodified; each still works
       standalone when opened directly. -->
  <title>yaad4-science-mass-weight-01</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    /* Lock the visible frame to a true 16:9 box, centered in whatever shape
       the host window/embed actually is, instead of stretching the iframe
       to fill it edge-to-edge regardless of aspect ratio. Each component's
       own scaleApp() still centers its 1280x710 canvas inside this frame,
       but now against a container that's already ~16:9 (design ratio
       1280/710 = 1.803 vs 16/9 = 1.778 — a ~1.4% difference), so the
       residual letterboxing it can ever produce is a few px, not the large
       bar a mismatched host shape previously produced. Background is white
       (not black) so that residual sliver reads as part of the white
       course canvas instead of a visible letterbox bar — every component's
       own html/body background is white for the same reason. */
    body { display: flex; align-items: center; justify-content: center; }
    #unit-frame {
      display: block; border: 0;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
    }
  </style>
</head>
<body>
  <iframe id="unit-frame" title="yaad4-science-mass-weight-01"></iframe>
  <script src="./unit-manifest.js"></script>
  <script src="./unit-shell.js"></script>
</body>
</html>
